# The action is shell, so it is linted like shell and PROVEN by deploying
# something. The integration job deploys to the runner itself over real SSH,
# because an action nobody has watched succeed is an action nobody should use.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: shell and workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck deploy.sh
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color
      # What the Marketplace requires, checked on every pull request rather than
      # discovered at the publish click.
      - name: action.yml is publishable
        run: bash tests/metadata.sh

  deploy:
    name: it actually deploys and verifies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A real SSH host: this runner. The action does not know or care that the
      # host it deploys to is the machine it runs on.
      - name: Stand up an SSH host with docker
        id: host
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server >/dev/null
          sudo systemctl start ssh
          ssh-keygen -t ed25519 -f "$RUNNER_TEMP/key" -N "" -C ci@test
          mkdir -p ~/.ssh
          cat "$RUNNER_TEMP/key.pub" >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/authorized_keys
          {
            echo 'key<<KEY_EOF'
            cat "$RUNNER_TEMP/key"
            echo 'KEY_EOF'
            echo 'known<<KNOWN_EOF'
            ssh-keyscan -p 22 127.0.0.1
            echo 'KNOWN_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Lay out the fixture the action will deploy
        run: |
          set -euo pipefail
          mkdir -p /opt/fixture
          printf 'fixture version 1.0.0\n' > /opt/fixture/index.html
          cp tests/docker-compose.yml /opt/fixture/docker-compose.yml
          echo 'FIXTURE_IMAGE=nginx:1.29-alpine' > /opt/fixture/.env
        shell: bash

      # The whole point: it deploys, waits for the container's own healthcheck,
      # and then proves from OUTSIDE that the served bytes carry the version.
      - name: Deploy and verify
        id: deployed
        uses: ./
        with:
          host: 127.0.0.1
          user: runner
          ssh-key: ${{ steps.host.outputs.key }}
          known-hosts: ${{ steps.host.outputs.known }}
          image: nginx:1.29-alpine
          compose-file: /opt/fixture/docker-compose.yml
          service: fixture
          wait-healthy: fixture
          verify-url: http://127.0.0.1:18080/
          verify-contains: "version 1.0.0"
          verify-timeout: "120"

      - name: The outputs say what ran
        env:
          DIGEST: ${{ steps.deployed.outputs.digest }}
          VERIFIED: ${{ steps.deployed.outputs.verified }}
        run: |
          set -euo pipefail
          [ "$VERIFIED" = "true" ] || { echo "::error::the action reported verified=$VERIFIED"; exit 1; }
          case "$DIGEST" in
            *@sha256:*) echo "ran $DIGEST" ;;
            *) echo "::error::no digest was recorded ($DIGEST)"; exit 1 ;;
          esac

      # A gate is proven by REFUSING. Each of these must fail the action, and
      # the job fails if any of them passes.
      - name: A verification that cannot pass is refused
        env:
          KEY: ${{ steps.host.outputs.key }}
          KNOWN: ${{ steps.host.outputs.known }}
        run: |
          set -euo pipefail
          run_action() {
            env INPUT_HOST=127.0.0.1 INPUT_USER=runner INPUT_PORT=22 \
                INPUT_SSH_KEY="$KEY" INPUT_KNOWN_HOSTS="$1" INPUT_INSECURE="${2:-false}" \
                INPUT_IMAGE=nginx:1.29-alpine \
                INPUT_COMPOSE_FILE=/opt/fixture/docker-compose.yml INPUT_SERVICE=fixture \
                INPUT_REMOTE_COMMAND="" INPUT_WAIT_HEALTHY="" INPUT_HEALTH_TIMEOUT=30 \
                INPUT_VERIFY_URL="$3" INPUT_VERIFY_CONTAINS="$4" \
                INPUT_VERIFY_TIMEOUT=15 INPUT_VERIFY_INTERVAL=3 \
                ./deploy.sh
          }

          echo "── a version the host does not serve must fail"
          if run_action "$KNOWN" false http://127.0.0.1:18080/ "version 9.9.9"; then
            echo "::error::the action passed while the host served the old version"; exit 1
          fi

          echo "── a verify-url with no verify-contains must fail"
          if run_action "$KNOWN" false http://127.0.0.1:18080/ ""; then
            echo "::error::the action accepted a bare 200 as proof"; exit 1
          fi

          echo "── an unpinned host key must fail"
          if run_action "" false http://127.0.0.1:18080/ "version 1.0.0"; then
            echo "::error::the action connected without a pinned host key"; exit 1
          fi

          echo "all three refusals held"

      # The security-hardening reference asks for exactly this audit: run the
      # thing with valid and invalid input and check the output for the secret.
      # Masking is the runner's job and it only redacts what it was told about;
      # this asserts the script never had to rely on it.
      - name: The key never reaches the output
        env:
          KEY: ${{ steps.host.outputs.key }}
          KNOWN: ${{ steps.host.outputs.known }}
        run: |
          set -euo pipefail
          # One line of the key body, which is neither the armour nor a header,
          # so a match means real key material and not a boilerplate line.
          needle="$(printf '%s\n' "$KEY" | sed -n '3p')"
          [ -n "$needle" ] || { echo "::error::could not take a sample line from the key"; exit 1; }

          # GITHUB_ACTIONS is cleared on purpose: with no runner listening,
          # the script must register nothing, so anything matching here is a
          # genuine leak rather than a mask command nobody consumed.
          captured="$RUNNER_TEMP/captured.log"
          set +e
          env GITHUB_ACTIONS= INPUT_HOST=127.0.0.1 INPUT_USER=runner INPUT_PORT=22 \
              INPUT_SSH_KEY="$KEY" INPUT_KNOWN_HOSTS="$KNOWN" INPUT_INSECURE=false \
              INPUT_IMAGE=nginx:1.29-alpine \
              INPUT_COMPOSE_FILE=/opt/fixture/docker-compose.yml INPUT_SERVICE=fixture \
              INPUT_REMOTE_COMMAND="" INPUT_WAIT_HEALTHY=fixture INPUT_HEALTH_TIMEOUT=30 \
              INPUT_VERIFY_URL=http://127.0.0.1:18080/ INPUT_VERIFY_CONTAINS="version 9.9.9" \
              INPUT_VERIFY_TIMEOUT=10 INPUT_VERIFY_INTERVAL=3 \
              GITHUB_OUTPUT=/dev/null \
              ./deploy.sh > "$captured" 2>&1
          set -e

          if grep -qF -- "$needle" "$captured"; then
            echo "::error::the action printed key material"
            exit 1
          fi
          # And a failing run must still leave nothing behind.
          if find "${RUNNER_TEMP}" -maxdepth 1 -name 'hetzner-deploy-*' | grep -q .; then
            echo "::error::a key directory survived the run"
            find "${RUNNER_TEMP}" -maxdepth 1 -name 'hetzner-deploy-*' -ls
            exit 1
          fi
          # And under a runner, the only lines carrying key material may be the
          # registration itself — which the runner consumes and never prints.
          masked="$RUNNER_TEMP/masked.log"
          set +e
          env INPUT_HOST=127.0.0.1 INPUT_USER=runner INPUT_PORT=22 \
              INPUT_SSH_KEY="$KEY" INPUT_KNOWN_HOSTS="$KNOWN" INPUT_INSECURE=false \
              INPUT_IMAGE=nginx:1.29-alpine \
              INPUT_COMPOSE_FILE=/opt/fixture/docker-compose.yml INPUT_SERVICE=fixture \
              INPUT_REMOTE_COMMAND="" INPUT_WAIT_HEALTHY=fixture INPUT_HEALTH_TIMEOUT=30 \
              INPUT_VERIFY_URL=http://127.0.0.1:18080/ INPUT_VERIFY_CONTAINS="version 9.9.9" \
              INPUT_VERIFY_TIMEOUT=10 INPUT_VERIFY_INTERVAL=3 \
              GITHUB_OUTPUT=/dev/null \
              ./deploy.sh > "$masked" 2>&1
          set -e
          if grep -F -- "$needle" "$masked" | grep -qv '^::add-mask::'; then
            echo "::error::key material appeared outside the mask registration"
            exit 1
          fi
          echo "no key material in the output, none outside the mask registration, and no key directory left behind"

  # Rollback is only worth having if it has been watched working, so this drives
  # a real moving tag: a local registry, two different images behind one
  # reference, and a deploy that cannot verify.
  rollback:
    name: a failed verification puts the previous version back
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: An SSH host, and a registry whose tag can move
        id: host
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server >/dev/null
          sudo systemctl start ssh
          ssh-keygen -t ed25519 -f "$RUNNER_TEMP/key" -N "" -C ci@test
          mkdir -p ~/.ssh
          cat "$RUNNER_TEMP/key.pub" >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys
          docker run -d --restart always -p 5000:5000 --name registry registry:3
          {
            echo 'key<<KEY_EOF'; cat "$RUNNER_TEMP/key"; echo 'KEY_EOF'
            echo 'known<<KNOWN_EOF'; ssh-keyscan -p 22 127.0.0.1; echo 'KNOWN_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish version one behind the moving tag, and deploy it
        id: first
        run: |
          set -euo pipefail
          # nginx serves a page saying nginx; httpd serves one saying "It works!".
          # Two genuinely different images behind ONE reference is what a deploy
          # actually is, and what a rollback has to undo.
          docker pull -q nginx:1.29-alpine
          docker tag nginx:1.29-alpine localhost:5000/fixture:current
          docker push -q localhost:5000/fixture:current
          mkdir -p /opt/rollback
          cat > /opt/rollback/docker-compose.yml <<'YML'
          services:
            fixture:
              image: localhost:5000/fixture:current
              container_name: rollback-fixture
              ports: ["18081:80"]
              restart: unless-stopped
          YML

      - uses: ./
        with:
          host: 127.0.0.1
          user: runner
          ssh-key: ${{ steps.host.outputs.key }}
          known-hosts: ${{ steps.host.outputs.known }}
          image: localhost:5000/fixture:current
          compose-file: /opt/rollback/docker-compose.yml
          service: fixture
          verify-url: http://127.0.0.1:18081/
          verify-contains: "nginx"
          verify-timeout: "90"

      - name: Move the tag to something else, then deploy what cannot verify
        id: second
        continue-on-error: true
        run: |
          set -euo pipefail
          docker pull -q httpd:2.4-alpine
          docker tag httpd:2.4-alpine localhost:5000/fixture:current
          docker push -q localhost:5000/fixture:current
          # The action is invoked directly so the step can fail and be asserted
          # on: `uses:` with continue-on-error would hide which half failed.
          set +e
          env INPUT_HOST=127.0.0.1 INPUT_USER=runner INPUT_PORT=22 \
              INPUT_SSH_KEY="${{ steps.host.outputs.key }}" \
              INPUT_KNOWN_HOSTS="${{ steps.host.outputs.known }}" \
              INPUT_INSECURE=false \
              INPUT_IMAGE=localhost:5000/fixture:current \
              INPUT_COMPOSE_FILE=/opt/rollback/docker-compose.yml INPUT_SERVICE=fixture \
              INPUT_REMOTE_COMMAND="" INPUT_WAIT_HEALTHY="" INPUT_HEALTH_TIMEOUT=30 \
              INPUT_ROLLBACK=true \
              INPUT_VERIFY_URL=http://127.0.0.1:18081/ \
              INPUT_VERIFY_CONTAINS="this version does not exist" \
              INPUT_VERIFY_TIMEOUT=20 INPUT_VERIFY_INTERVAL=4 \
              GITHUB_OUTPUT="$RUNNER_TEMP/rollback-output" \
              ./deploy.sh
          rc=$?
          set -e
          [ "$rc" -ne 0 ] || { echo "::error::the action passed on a verification that cannot succeed"; exit 1; }
          echo "the action failed, as it must"

      - name: The host is serving version one again
        run: |
          set -euo pipefail
          served="$(curl -sS -m 15 http://127.0.0.1:18081/ || true)"
          case "$served" in
            *nginx*) echo "rolled back: the host serves version one again" ;;
            *"It works"*) echo "::error::the host is still serving the failed deploy"; exit 1 ;;
            *) echo "::error::the host serves neither version: ${served:0:120}"; exit 1 ;;
          esac
          grep -q '^rolled-back=true$' "$RUNNER_TEMP/rollback-output" \
            || { echo "::error::the action did not report rolled-back=true"; cat "$RUNNER_TEMP/rollback-output"; exit 1; }

  conclusion:
    name: conclusion
    needs: [lint, deploy, rollback]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          echo "$RESULTS" | grep -q '"result": *"failure"' && { echo "::error::a job failed"; exit 1; }
          echo "$RESULTS" | grep -q '"result": *"cancelled"' && { echo "::error::a job was cancelled"; exit 1; }
          echo "ok"
