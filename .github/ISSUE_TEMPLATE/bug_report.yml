name: Something is wrong
description: A deploy behaved differently from what the README says it does.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste a private key, a host key, or a full workflow log
        without reading it first. This action handles a credential, so a bug
        report is exactly the place one gets leaked by accident.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true
  - type: textarea
    id: step
    attributes:
      label: The step, as you wrote it
      description: With the secrets replaced by their names.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: What the action printed
      description: The lines beginning with an arrow, and the error. Redact anything else.
      render: text
    validations:
      required: true
  - type: input
    id: runner
    attributes:
      label: Runner
      placeholder: ubuntu-latest
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Which version of this action
      placeholder: v1.0.0, or the commit SHA
    validations:
      required: true
